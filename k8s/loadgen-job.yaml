# Load generator Job, applied by scripts/lib/k8s.sh (k8s_loadgen), which
# substitutes __IMAGE__ and __GEN_CONFIG__. It mounts the `socialnet-config`
# ConfigMap generated by k8s/base and keeps the pod alive after the run so the
# smoke can copy the traces out of /out.
apiVersion: batch/v1
kind: Job
metadata:
  name: loadgen
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: {app: loadgen}
    spec:
      restartPolicy: Never
      containers:
      - name: loadgen
        image: __IMAGE__
        imagePullPolicy: Always
        command: ["sh", "-c"]
        args:
        - >-
          socialnet-entrypoint client-bench &&
          touch /out/DONE && echo LOADGEN_DONE && sleep 3600
        env:
        - {name: SOCIALNET_GEN_CONFIG, value: "/etc/socialnet/__GEN_CONFIG__"}
        - {name: SOCIALNET_WAIT_SECS, value: "300"}
        volumeMounts:
        - {name: config, mountPath: /etc/socialnet, readOnly: true}
        - {name: out, mountPath: /out}
      volumes:
      - name: config
        configMap: {name: socialnet-config}
      - name: out
        emptyDir: {}
