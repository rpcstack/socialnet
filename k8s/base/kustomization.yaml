# socialnet on rpcstack, baseline policy (generated stubs use no-op hooks).
#
# The ConfigMap is generated from the repository's config/ directory, which is
# outside this kustomization, so render with:
#   kubectl kustomize --load-restrictor LoadRestrictionsNone k8s/base
# scripts/k8s-deploy.sh does this for you.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rpcstack-socialnet
resources:
  - namespace.yaml
  - infra.yaml
  - socialnet.yaml
# Services are configured through environment variables; the ConfigMap only
# carries the load generator configs. A fixed name lets the smoke Jobs mount it.
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: socialnet-config
    files:
      - ../../config/gen_config.json
      - ../../config/gen_config.overload.json
images:
  - name: rpcstack-socialnet
    newName: localhost:5001/rpcstack-socialnet
    newTag: baseline
