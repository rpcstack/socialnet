# socialnet infrastructure: MongoDB, Redis, Memcached and RabbitMQ.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: post-storage-mongo
  labels: {app: post-storage-mongo, tier: infra}
spec:
  replicas: 1
  selector:
    matchLabels: {app: post-storage-mongo}
  template:
    metadata:
      labels: {app: post-storage-mongo, tier: infra}
    spec:
      containers:
      - name: post-storage-mongo
        image: mongo:7.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 27017
        readinessProbe:
          tcpSocket: {port: 27017}
          periodSeconds: 2
          failureThreshold: 90
---
apiVersion: v1
kind: Service
metadata:
  name: post-storage-mongo
spec:
  selector: {app: post-storage-mongo}
  ports:
  - {port: 27017, targetPort: 27017}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: post-storage-memcached
  labels: {app: post-storage-memcached, tier: infra}
spec:
  replicas: 1
  selector:
    matchLabels: {app: post-storage-memcached}
  template:
    metadata:
      labels: {app: post-storage-memcached, tier: infra}
    spec:
      containers:
      - name: post-storage-memcached
        image: memcached:1.6
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 11211
        readinessProbe:
          tcpSocket: {port: 11211}
          periodSeconds: 2
          failureThreshold: 90
---
apiVersion: v1
kind: Service
metadata:
  name: post-storage-memcached
spec:
  selector: {app: post-storage-memcached}
  ports:
  - {port: 11211, targetPort: 11211}
