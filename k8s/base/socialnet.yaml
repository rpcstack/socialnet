# socialnet application services (one binary of the shared image each, selected
# by the image entrypoint's first argument).
#
# Application services reach each other as <service>-1: the application's
# replica-aware channels dial "<ip>-<n>:<port>", so every Service is named
# "<service>-1" and the *_IP environment variables carry the "<service>" stem.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: post-storage-service
  labels: {app: post-storage-service, tier: app}
spec:
  replicas: 1
  selector:
    matchLabels: {app: post-storage-service}
  template:
    metadata:
      labels: {app: post-storage-service, tier: app}
    spec:
      containers:
      - name: post-storage-service
        image: rpcstack-socialnet
        imagePullPolicy: Always
        args: ["post-storage-service"]
        ports:
        - containerPort: 8080
        env:
        - {name: POST_STORAGE_MONGODB_URI, value: "mongodb://post-storage-mongo:27017"}
        - {name: POST_STORAGE_MONGODB_DATABASE, value: "post-storage"}
        - {name: POST_STORAGE_MEMCACHED_ADDR, value: "tcp://post-storage-memcached:11211"}
        - {name: RUST_LOG, value: "info"}
        readinessProbe:
          tcpSocket: {port: 8080}
          periodSeconds: 2
          failureThreshold: 90
---
apiVersion: v1
kind: Service
metadata:
  name: post-storage-service-1
spec:
  selector: {app: post-storage-service}
  ports:
  - {port: 8080, targetPort: 8080}
---
