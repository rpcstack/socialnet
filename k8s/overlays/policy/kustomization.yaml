# The policy/ directory's RPC policy (run queue + module stack): same manifests,
# image built with MODE=policy. Starts as a no-op, like baseline.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: localhost:5001/rpcstack-socialnet
    newTag: policy
