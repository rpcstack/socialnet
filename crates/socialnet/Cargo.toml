[package]
name = "socialnet"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "textservice_server"
path = "src/text_service/main.rs"

[[bin]]
name = "usermention_server"
path = "src/user_mention/main.rs"

[[bin]]
name = "url_shorten_server"
path = "src/url_shorten/main.rs"

[[bin]]
name = "user_service"
path = "src/user/main.rs"

[[bin]]
name = "user_timeline_server"
path = "src/user_timeline/main.rs"

[[bin]]
name = "post_storage_server"
path = "src/post_storage/main.rs"

[[bin]]
name = "compose_post_server"
path = "src/compose_post/main.rs"

[[bin]]
name = "register_user_server"
path = "src/register_user/main.rs"

[[bin]]
name = "frontend_server"
path = "src/frontend/main.rs"

[[bin]]
name = "home_timeline_server"
path = "src/home_timeline/main.rs"

[[bin]]
name = "social_graph_server"
path = "src/social_graph/main.rs"

[[bin]]
name = "write_home_timeline_server"
path = "src/write_home_timeline/main.rs"

[[bin]]
name = "media_service"
path = "src/media/main.rs"

[[bin]]
name = "unique_id_service"
path = "src/unique_id/server.rs"

[[bin]]
name = "socialnet_policy_probe"
path = "src/probe/main.rs"

[[bin]]
name = "socialnet_http_check"
path = "src/http_check/main.rs"

[[bin]]
name = "socialnet_client_bench"
path = "src/client/client_bench.rs"

[features]
# Policy modes. `baseline` (no features) is the framework default: no-op hooks
# (`tonic::rpcstack::noop::NoopHooks`) and the default FIFO run queue.
default = []
baseline = []
# The RPC policy (run queue + module stack) comes from the `policy/` crate,
# initially a no-op. Stubs default to `socialnet_policy::Hooks`. Build it with
# `--features policy`.
policy = ["dep:socialnet-policy"]

[dependencies]
tonic = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
app-utils = { path = "../app-utils" }
socialnet-policy = { path = "../../policy", optional = true }
prost = "0.12"
mongodb = "=2.8.2"
async-memcached = "0.5.0"
deadpool-redis = { version = "0.14.0", features = ["rt_tokio_1", "cluster"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
rand = "0.8.5"
log = "0.4"
env_logger = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.11.1"
chrono = "0.4.23"
once_cell = "1.20"
structopt = "0.3.23"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0.100"
futures-lite = "2.0.0"
lapin = "2.3.1"
jsonwebtoken = "9.3.1"
sha2 = "0.10.9"
hex = "0.4.3"
http = "0.2"
httpdate = "1"
form_urlencoded = "1"
hyper = { version = "0.14", features = ["server", "client", "http1", "tcp"] }

[dev-dependencies]
rpcstack-tonic = { workspace = true }
rpcstack-sched = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }
protoc-bin-vendored = "3"
