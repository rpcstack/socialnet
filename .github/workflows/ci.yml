name: ci
on:
  push:
    branches: [main, "port/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: ./scripts/check.sh
      - run: ./scripts/test.sh

  image:
    # Build both mode images to make sure the Dockerfile and compose file work.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [baseline, masa]
    steps:
      - uses: actions/checkout@v4
      - run: MODE=${{ matrix.mode }} docker compose config -q
      - run: docker build --build-arg MODE=${{ matrix.mode }} -t rpcstack-socialnet:${{ matrix.mode }} .
